<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dashboard de Confirmações Seguro</title>
  <style>
    body { font-family: 'Montserrat', sans-serif; background:#060a23; color:white; margin:0; padding:40px; text-align:center; }
    h1 { color:#d4af37; }
    #loginForm, #dashboard { max-width: 400px; margin: auto; }
    input { width: 100%; padding: 10px; margin: 10px 0; border-radius: 5px; border: none; font-size: 16px; }
    button { width: 100%; padding: 12px; background:#d4af37; border:none; border-radius:5px; font-weight:600; cursor:pointer; }
    button:hover { background:#b8962e; }
    ul { list-style:none; padding:0; max-width:600px; margin:auto; text-align:left; }
    li { background:#1a1f44; margin:8px 0; padding:12px 20px; border-radius:6px; font-size:18px; }
  </style>
</head>
<body>

  <h1>Dashboard de Confirmações</h1>

  <!-- FORMULÁRIO DE LOGIN -->
  <div id="loginForm">
    <input type="email" id="email" placeholder="Email" />
    <input type="password" id="senha" placeholder="Senha" />
    <button onclick="login()">Entrar</button>
    <p id="loginError" style="color:#ff5c5c;"></p>
  </div>

  <!-- DASHBOARD (escondido até login) -->
  <div id="dashboard" style="display:none;">
    <button onclick="logout()">Sair</button>
    <h2>Confirmações em Tempo Real</h2>
    <ul id="listaConfirmacoes"></ul>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
    import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

   const firebaseConfig = {
  apiKey: "AIzaSyDvO4Y_Lctz1hUCqnZIcv1sBscG5alxu5c",
  authDomain: "convite-elaine.firebaseapp.com",
  projectId: "convite-elaine",
  storageBucket: "convite-elaine.firebasestorage.app",
  messagingSenderId: "777094408208",
  appId: "1:777094408208:web:27123efe232a6130cc8295"
};

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const loginForm = document.getElementById("loginForm");
    const dashboard = document.getElementById("dashboard");
    const loginError = document.getElementById("loginError");
    const lista = document.getElementById("listaConfirmacoes");

    function login() {
      loginError.textContent = "";
      const email = document.getElementById("email").value;
      const senha = document.getElementById("senha").value;
      signInWithEmailAndPassword(auth, email, senha)
        .catch(error => {
          loginError.textContent = "Erro: " + error.message;
        });
    }

    function logout() {
      signOut(auth);
    }

    onAuthStateChanged(auth, user => {
      if (user) {
        loginForm.style.display = "none";
        dashboard.style.display = "block";
        startListeningConfirmacoes();
      } else {
        loginForm.style.display = "block";
        dashboard.style.display = "none";
        lista.innerHTML = "";
        if (unsubscribeConfirmacoes) unsubscribeConfirmacoes();
      }
    });

    let unsubscribeConfirmacoes;

    function startListeningConfirmacoes() {
      const confirmacoesRef = collection(db, "confirmacoes");

      unsubscribeConfirmacoes = onSnapshot(confirmacoesRef, snapshot => {
        lista.innerHTML = "";
        snapshot.forEach(doc => {
          const data = doc.data();
          const dataFormatada = data.data.toDate
            ? data.data.toDate().toLocaleString()
            : new Date(data.data.seconds * 1000).toLocaleString();
          const li = document.createElement("li");
          li.textContent = `${data.nome} - ${dataFormatada}`;
          lista.appendChild(li);
        });
      });
    }
  </script>

</body>
</html>
